name: Bug report
description: Report an E10 driver or Label Studio problem
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - E10 driver / CUPS / Bluetooth
        - Label Studio
        - Installer / packaging
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distribution
      placeholder: Linux Mint 22.x
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer model / Bluetooth name prefix
      placeholder: SUPVAN E10 / T0010...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Please include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private label contents, serials or identifiers you do not want public.
      render: shell
