name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  driver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo test --workspace
      - run: cargo check --all-targets

  label-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: label-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest pillow qrcode
      - run: PYTHONPATH=. python -m pytest -q
      - run: python -m py_compile supvan_label_studio/core.py supvan_label_studio/print_backend.py supvan_label_studio/app.py
