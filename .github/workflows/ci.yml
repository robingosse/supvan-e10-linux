name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  driver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo test --workspace
      - run: cargo check --all-targets

  label-studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: label-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest pillow qrcode
      - name: Compile all Studio modules
        run: python -m py_compile supvan_label_studio/*.py
      - name: Run Label Studio tests
        run: PYTHONPATH=. python -m pytest -q
      - name: Exact-raster self-test
        run: PYTHONPATH=. python scripts/self-test.py
      - name: Build v0.3.2 source and self-extracting installer
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(PYTHONPATH=. python -c 'from supvan_label_studio import __version__; print(__version__)')"
          NAME="supvan-label-studio-v${VERSION}"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/$NAME"
          rsync -a --exclude='.pytest_cache' --exclude='__pycache__' --exclude='*.pyc' ./ "$STAGE/$NAME/"
          tar -C "$STAGE" -czf "$NAME.tar.gz" "$NAME"
          cat packaging/self-extract-header.sh "$NAME.tar.gz" > "$NAME.run"
          chmod +x "$NAME.run"
          sha256sum "$NAME.run" "$NAME.tar.gz" > "SHA256SUMS-$NAME.txt"
          mkdir -p dist
          mv "$NAME.run" "$NAME.tar.gz" "SHA256SUMS-$NAME.txt" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: supvan-label-studio
          path: label-studio/dist/*
          if-no-files-found: error
